kaggle_dataset: andrewmvd/animal-faces
raw_dir: data/raw/afhq    # contains train/ and val/, each with cat/ dog/ wild/
train_split: train        # 14,630 images
test_split: val           # 1,500 images (official AFHQ val, used as our test set)
image_size: 256           # 128 for diffusion if compute is limited
mask_ratio: [0.10, 0.40]  # square hole covers 10-40% of image area
test_seed: 1234           # fixed seed -> identical test holes for every method
num_samples_K: 5          # fills per test image for stochastic methods
